name: Deploy Backend Services (AWS EC2)

on:
  push:
    branches:
      - main # Production deployment
      - develop # Staging deployment
    paths:
      - "backend/**"
      - "analyzer/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch: # Allow manual deployment
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set environment variables
        run: |
          if [ "${{ steps.env.outputs.environment }}" == "production" ]; then
            echo "DEPLOY_PATH=/home/ubuntu/apps/production" >> $GITHUB_ENV
            echo "BACKEND_PORT=3000" >> $GITHUB_ENV
            echo "ANALYZER_PORT=8080" >> $GITHUB_ENV
            echo "RUST_ANALYZER_URL=http://localhost:8080" >> $GITHUB_ENV
            echo "PM2_APP_NAME=backend-prod" >> $GITHUB_ENV
            echo "PM2_ANALYZER_NAME=analyzer-prod" >> $GITHUB_ENV
            echo "ENV_FILE=.env.production" >> $GITHUB_ENV
            echo "ANALYZER_ENV_FILE=.env.analyzer.production" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/home/ubuntu/apps/staging" >> $GITHUB_ENV
            echo "BACKEND_PORT=3001" >> $GITHUB_ENV
            echo "ANALYZER_PORT=8081" >> $GITHUB_ENV
            echo "RUST_ANALYZER_URL=http://localhost:8081" >> $GITHUB_ENV
            echo "PM2_APP_NAME=backend-staging" >> $GITHUB_ENV
            echo "PM2_ANALYZER_NAME=analyzer-staging" >> $GITHUB_ENV
            echo "ENV_FILE=.env.staging" >> $GITHUB_ENV
            echo "ANALYZER_ENV_FILE=.env.analyzer.staging" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need at least 2 commits to compare

      - name: Check for analyzer changes
        id: analyzer-changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - always rebuild
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Manual trigger detected - will rebuild analyzer"
          else
            # Check if analyzer files changed
            if git diff --name-only HEAD~1 HEAD | grep -q "^analyzer/"; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Analyzer files changed - will rebuild"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "No analyzer changes detected - skipping rebuild"
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Setup Rust
        if: steps.analyzer-changes.outputs.changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - name: Setup Rust cache
        if: steps.analyzer-changes.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./analyzer"
          cache-on-failure: true

      - name: Create deployment directory
        run: |
          mkdir -p ${{ env.DEPLOY_PATH }}
          mkdir -p ${{ env.DEPLOY_PATH }}/logs

      - name: Backup current deployment
        run: |
          if [ -d "${{ env.DEPLOY_PATH }}/backend" ]; then
            echo "Creating backup of current deployment..."
            mkdir -p ${{ env.DEPLOY_PATH }}/backups
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Backup only essential files (exclude node_modules and large build artifacts)
            tar -czf ${{ env.DEPLOY_PATH }}/backups/backup_${TIMESTAMP}.tar.gz \
              -C ${{ env.DEPLOY_PATH }} \
              --exclude='backend/node_modules' \
              --exclude='backend/dist' \
              --exclude='analyzer/target' \
              backend analyzer 2>/dev/null || true
            
            # Keep only last 3 backups
            cd ${{ env.DEPLOY_PATH }}/backups && ls -t backup_*.tar.gz | tail -n +4 | xargs -r rm || true
            
            echo "Backup created (excluding node_modules and build artifacts)"
          fi

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: Build Rust analyzer
        if: steps.analyzer-changes.outputs.changed == 'true'
        working-directory: ./analyzer
        run: |
          echo "Building Rust analyzer (this may take ~10 minutes)..."
          cargo build --release
          echo "✓ Rust analyzer build complete"

      - name: Deploy backend
        run: |
          echo "Deploying to ${{ steps.env.outputs.environment }} environment"

          # Copy backend files
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            ./backend/ ${{ env.DEPLOY_PATH }}/backend/

          # Copy built files
          cp -r ./backend/node_modules ${{ env.DEPLOY_PATH }}/backend/
          cp -r ./backend/dist ${{ env.DEPLOY_PATH }}/backend/

          # Copy the appropriate ecosystem config file
          if [ "${{ steps.env.outputs.environment }}" == "production" ]; then
            cp ./backend/ecosystem.production.config.js ${{ env.DEPLOY_PATH }}/backend/ecosystem.config.js
          else
            cp ./backend/ecosystem.staging.config.js ${{ env.DEPLOY_PATH }}/backend/ecosystem.config.js
          fi

      - name: Deploy analyzer
        if: steps.analyzer-changes.outputs.changed == 'true'
        run: |
          # Copy analyzer binary (the server binary is what we deploy)
          mkdir -p ${{ env.DEPLOY_PATH }}/analyzer
          cp ./analyzer/target/release/server ${{ env.DEPLOY_PATH }}/analyzer/
          chmod +x ${{ env.DEPLOY_PATH }}/analyzer/server
          
          # Copy the appropriate PM2 ecosystem config file
          if [ "${{ steps.env.outputs.environment }}" == "production" ]; then
            cp ./analyzer/ecosystem.production.config.js ${{ env.DEPLOY_PATH }}/analyzer/ecosystem.config.js
          else
            cp ./analyzer/ecosystem.staging.config.js ${{ env.DEPLOY_PATH }}/analyzer/ecosystem.config.js
          fi
          echo "✓ Analyzer binary and config deployed"

      - name: Copy analyzer environment file
        if: steps.analyzer-changes.outputs.changed == 'true'
        run: |
          if [ -f "${{ env.DEPLOY_PATH }}/${{ env.ANALYZER_ENV_FILE }}" ]; then
            cp ${{ env.DEPLOY_PATH }}/${{ env.ANALYZER_ENV_FILE }} ${{ env.DEPLOY_PATH }}/analyzer/.env
            echo "✓ Analyzer environment file copied"
          else
            echo "Warning: Analyzer environment file ${{ env.ANALYZER_ENV_FILE }} not found!"
            echo "Creating minimal .env with PORT only..."
            echo "PORT=${{ env.ANALYZER_PORT }}" > ${{ env.DEPLOY_PATH }}/analyzer/.env
            echo "SHARED_WORKSPACE_PATH=/tmp/shared/workspaces" >> ${{ env.DEPLOY_PATH }}/analyzer/.env
          fi

      - name: Copy environment file
        run: |
          if [ -f "${{ env.DEPLOY_PATH }}/${{ env.ENV_FILE }}" ]; then
            cp ${{ env.DEPLOY_PATH }}/${{ env.ENV_FILE }} ${{ env.DEPLOY_PATH }}/backend/.env
            # Ensure RUST_ANALYZER_URL is set in backend .env
            if ! grep -q "RUST_ANALYZER_URL" ${{ env.DEPLOY_PATH }}/backend/.env; then
              echo "RUST_ANALYZER_URL=${{ env.RUST_ANALYZER_URL }}" >> ${{ env.DEPLOY_PATH }}/backend/.env
              echo "✓ Added RUST_ANALYZER_URL to backend .env"
            else
              # Update existing RUST_ANALYZER_URL
              sed -i "s|^RUST_ANALYZER_URL=.*|RUST_ANALYZER_URL=${{ env.RUST_ANALYZER_URL }}|" ${{ env.DEPLOY_PATH }}/backend/.env
              echo "✓ Updated RUST_ANALYZER_URL in backend .env"
            fi
          else
            echo "Warning: Environment file ${{ env.ENV_FILE }} not found!"
            exit 1
          fi

      - name: Stop existing services
        run: |
          # Stop backend
          pm2 stop ${{ env.PM2_APP_NAME }} || true
          pm2 delete ${{ env.PM2_APP_NAME }} || true

          # Stop analyzer using PM2 (only if analyzer was changed)
          if [ "${{ steps.analyzer-changes.outputs.changed }}" == "true" ]; then
            pm2 stop ${{ env.PM2_ANALYZER_NAME }} || true
            pm2 delete ${{ env.PM2_ANALYZER_NAME }} || true
            
            # Kill any remaining analyzer processes (fallback)
            pkill -f "${{ env.DEPLOY_PATH }}/analyzer/server" || true
            sleep 2
          fi

      - name: Start backend with PM2
        run: |
          cd ${{ env.DEPLOY_PATH }}/backend

          # Verify files exist
          echo "Checking backend deployment..."
          ls -la
          echo "Checking dist directory..."
          ls -la dist/ || echo "dist directory not found!"
          echo "Checking node_modules..."
          ls -la node_modules/.bin/node || echo "node not found in node_modules!"
          echo "Checking .env file..."
          ls -la .env || echo ".env file not found!"

          # Start with ecosystem config
          pm2 start ecosystem.config.js
          pm2 save

          echo "PM2 process started. Checking status..."
          pm2 list
          sleep 3
          pm2 logs ${{ env.PM2_APP_NAME }} --lines 50 --nostream

      - name: Start analyzer service
        if: steps.analyzer-changes.outputs.changed == 'true'
        run: |
          cd ${{ env.DEPLOY_PATH }}/analyzer

          # Verify files exist
          echo "Checking analyzer deployment..."
          ls -la
          echo "Checking server binary..."
          ls -la server || echo "Server binary not found!"
          echo "Checking ecosystem config..."
          ls -la ecosystem.config.js || echo "Ecosystem config not found!"

          # Ensure shared workspace directory exists
          mkdir -p /tmp/shared/workspaces
          chmod 755 /tmp/shared/workspaces

          # Start analyzer with PM2 (same as backend)
          pm2 start ecosystem.config.js
          pm2 save

          echo "PM2 analyzer process started. Checking status..."
          pm2 list
          sleep 3
          pm2 logs ${{ env.PM2_ANALYZER_NAME }} --lines 50 --nostream

      - name: Health check - Backend
        run: |
          echo "Waiting for backend to start..."
          sleep 10

          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f http://localhost:${{ env.BACKEND_PORT }}/health > /dev/null 2>&1; then
              echo "✓ Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            sleep 2
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "✗ Backend health check failed!"
          echo "=== PM2 Status ==="
          pm2 list
          echo "=== PM2 Logs (last 100 lines) ==="
          pm2 logs ${{ env.PM2_APP_NAME }} --lines 100 --nostream || true
          echo "=== Backend Error Log ==="
          tail -100 ${{ env.DEPLOY_PATH }}/logs/backend-error.log || echo "No error log found"
          echo "=== Backend Out Log ==="
          tail -100 ${{ env.DEPLOY_PATH }}/logs/backend-out.log || echo "No out log found"
          echo "=== Checking if port is in use ==="
          netstat -tuln | grep ${{ env.BACKEND_PORT }} || echo "Port ${{ env.BACKEND_PORT }} is not listening"
          echo "=== Checking .env file ==="
          ls -la ${{ env.DEPLOY_PATH }}/backend/.env || echo ".env file not found"
          exit 1

      - name: Verify analyzer is running
        if: steps.analyzer-changes.outputs.changed != 'true'
        run: |
          echo "Analyzer was not rebuilt - verifying existing instance is running..."
          if curl -f http://localhost:${{ env.ANALYZER_PORT }}/health > /dev/null 2>&1; then
            echo "✓ Analyzer is healthy (using existing instance)"
          else
            echo "⚠️  Analyzer health check failed - but skipping rebuild as no changes detected"
            echo "If analyzer is not running, you may need to manually restart it or trigger a full rebuild"
            pm2 list | grep -E "(analyzer|NAME)" || true
          fi

      - name: Health check - Analyzer
        if: steps.analyzer-changes.outputs.changed == 'true'
        run: |
          echo "Checking analyzer after rebuild..."
          sleep 5

          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f http://localhost:${{ env.ANALYZER_PORT }}/health > /dev/null 2>&1; then
              echo "✓ Analyzer is healthy on port ${{ env.ANALYZER_PORT }}"
              exit 0
            fi
            echo "Waiting for analyzer... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            sleep 2
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "✗ Analyzer health check failed!"
          echo "=== PM2 Status ==="
          pm2 list
          echo "=== PM2 Analyzer Logs (last 100 lines) ==="
          pm2 logs ${{ env.PM2_ANALYZER_NAME }} --lines 100 --nostream || true
          echo "=== Analyzer Error Log ==="
          tail -50 ${{ env.DEPLOY_PATH }}/logs/analyzer-error.log || echo "No analyzer error log found"
          echo "=== Analyzer Out Log ==="
          tail -50 ${{ env.DEPLOY_PATH }}/logs/analyzer-out.log || echo "No analyzer out log found"
          echo "=== Checking if analyzer process is running ==="
          pgrep -f "server" || echo "No server process found"
          echo "=== Checking if port is in use ==="
          netstat -tuln | grep ${{ env.ANALYZER_PORT }} || echo "Port ${{ env.ANALYZER_PORT }} is not listening"
          echo "=== Checking analyzer .env file ==="
          ls -la ${{ env.DEPLOY_PATH }}/analyzer/.env || echo "Analyzer .env file not found"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "════════════════════════════════════════════════"
          echo "✓ Deployment successful!"
          echo "════════════════════════════════════════════════"
          echo "Environment: ${{ steps.env.outputs.environment }}"
          echo "Backend Port: ${{ env.BACKEND_PORT }}"
          echo "Analyzer Port: ${{ env.ANALYZER_PORT }}"
          echo "Deployed to: ${{ env.DEPLOY_PATH }}"
          echo "Analyzer Rebuilt: ${{ steps.analyzer-changes.outputs.changed }}"
          echo "PM2 Apps:"
          pm2 list
          echo "════════════════════════════════════════════════"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed! Attempting rollback..."

          LATEST_BACKUP=$(ls -t ${{ env.DEPLOY_PATH }}/backups/backup_*.tar.gz 2>/dev/null | head -n1)

          if [ -n "$LATEST_BACKUP" ]; then
            echo "Restoring from backup: $LATEST_BACKUP"
            tar -xzf "$LATEST_BACKUP" -C ${{ env.DEPLOY_PATH }}
            
            # Restart services
            pm2 restart ${{ env.PM2_APP_NAME }} || pm2 start ${{ env.DEPLOY_PATH }}/backend/ecosystem.config.js
            # Only restart analyzer if it exists
            if pm2 list | grep -q "${{ env.PM2_ANALYZER_NAME }}"; then
              pm2 restart ${{ env.PM2_ANALYZER_NAME }} || pm2 start ${{ env.DEPLOY_PATH }}/analyzer/ecosystem.config.js
            fi
            
            echo "Rollback completed"
          else
            echo "No backup found for rollback"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✓ Deployment to ${{ steps.env.outputs.environment }} completed successfully"
          else
            echo "✗ Deployment to ${{ steps.env.outputs.environment }} failed"
          fi
